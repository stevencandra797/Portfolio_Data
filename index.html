<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steven Candra Purnomo | Data Analyst</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0a192f;
            color: #cbd5e1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            width: 100%;
            text-align: center;
        }

        .profile-section {
            margin-bottom: 40px;
        }

        h1 {
            color: #0d9488;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        p.tagline {
            color: #94a3b8;
            font-size: 1.1rem;
        }

        .contact-section {
            width: 100%;
            max-width: 600px;
            margin: 40px auto 0 auto;
            padding-top: 30px;
            border-top: 1px solid #1e293b;
            text-align: left;
        }

        .contact-section h2 {
            color: #0d9488;
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        .contact-section p {
            color: #cbd5e1;
            font-size: 14px;
            margin-bottom: 20px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 10px 12px;
            border-radius: 4px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        textarea:focus {
            border-color: #0d9488;
        }

        button[type="submit"] {
            padding: 10px 16px;
            background-color: #0d9488;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: background-color 0.2s ease;
        }

        button[type="submit"]:hover {
            background-color: #0f766e;
        }
    </style>
</head>
<body>

    <div class="container">
        <section class="profile-section">
            <h1>Steven Candra Purnomo</h1>
            <p class="tagline">Data Analyst | Turning Data into Actionable Insights</p>
        </section>

        <section class="contact-section">
            <h2>Get in Touch</h2>
            <p>Have a question or want to collaborate? Send me a message below.</p>

            <form action="https://api.web3forms.com/submit" method="POST">
                <input type="hidden" name="access_key" value="e55c94ad-1084-4c35-a70b-332b1ad8718b">

                <input type="text" name="name" placeholder="Your Name" required>
                <input type="email" name="email" placeholder="Your Email" required>
                <textarea name="message" rows="4" placeholder="Your Message" required></textarea>

                <button type="submit">Send Message</button>
            </form>
        </section>
    </div>

</body>
</html>
